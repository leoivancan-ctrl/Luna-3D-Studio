
name: Luna Ultimate 6.0 3D APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekt
        uses: actions/checkout@v4

      - name: Raspakiraj Lunu 6.0
        run: |
          unzip -o Luna_Ultimate_6_0_3D_SPOJENO_SOURCE.zip -d .

      - name: Postavi Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Postavi Android SDK
        uses: android-actions/setup-android@v3

      - name: Postavi Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Izradi Luna Ultimate 6.0 APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Spremi APK
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Ultimate-6-3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
          
          
