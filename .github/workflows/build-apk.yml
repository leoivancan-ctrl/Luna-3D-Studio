
name: Luna 3D Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Raspakiraj Lunu
        run: unzip -o Luna_3D_Studio_6_0_ANDROID_SOURCE.zip -d .
        
          

      - name: Postavi Javu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Postavi Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ispravi Android konfiguraciju
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'hr.luna.studio'
              compileSdk 35

              defaultConfig {
                  applicationId 'hr.luna.studio'
                  minSdk 26
                  targetSdk 35
                  versionCode 50
                  versionName '5.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Izradi APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Spremi APK
        uses: actions/upload-artifact@v4
        with:
          name: Luna-3D-Studio-5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
          
